<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#083f73">
<title>MenCare — Patient Demo</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="brand-mark" aria-hidden="true"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v6c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6l7-3z"/><path d="M9 12l2 2 4-4"/></svg></span>
    <div>
      <strong data-i18n="brand">MenCare</strong>
      <span class="brand-sub" data-i18n="brandSub">Demo workspace</span>
    </div>
  </div>
  <button id="langToggle" class="ghost" type="button">العربية</button>
</header>

<nav class="tabs" role="tablist" aria-label="Demo roles">
  <button class="tab active" data-role="patient" role="tab" data-i18n="tabPatient">Patient</button>
  <button class="tab" data-role="dispatch" role="tab" data-i18n="tabDispatch">Dispatch</button>
  <button class="tab" data-role="lab" role="tab" data-i18n="tabLab">Lab</button>
</nav>

<div id="notice" class="notice" hidden></div>
<main id="view"></main>

<script src="js/i18n.js"></script>
<script src="js/state.js"></script>
<script src="js/app.js"></script>
</body>
</html>
